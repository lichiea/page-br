<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Защищенная зона (Firebase)</title>
    <style>
        /* Секретный блок скрыт по умолчанию */
        #secret-content { display: none; border: 2px solid green; padding: 20px; margin-top: 20px; }
        #login-screen { text-align: center; margin-top: 50px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen">
        <h2>Доступ ограничен</h2>
        <p>Пожалуйста, войдите через GitHub, чтобы продолжить.</p>
        <button id="btn-login" style="padding: 10px 20px; font-size: 16px;">Войти через GitHub</button>
    </div>

    <!-- Секретный контент (скрыт) -->
    <div id="secret-content">
        <h1>Добро пожаловать, <span id="user-name"></span>!</h1>
        <p>Это секретная информация, доступная только авторизованным пользователям.</p>
        <button id="btn-logout">Выйти</button>
    </div>

    <!-- Подключаем Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GitHubAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyApSslyH0-86f3_HQi_UgZbZg0P4DATwg0",
          authDomain: "rbpo-br.firebaseapp.com",
          projectId: "rbpo-br",
          storageBucket: "rbpo-br.firebasestorage.app",
          messagingSenderId: "827284844767",
          appId: "1:827284844767:web:b9f1878ad2145d636e396a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GitHubAuthProvider();

        // Элементы DOM
        const loginScreen = document.getElementById('login-screen');
        const secretContent = document.getElementById('secret-content');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const userName = document.getElementById('user-name');

        // 1. Слушаем состояние авторизации
        onAuthStateChanged(auth, (user) => {
            if (user) {
              // Пользователь вошел
              import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
              const db = getFirestore(app);
              // Внутри onAuthStateChanged, когда user существует:
              const docRef = doc(db, "secrets", "my_super_secret_doc");
              const docSnap = await getDoc(docRef);
              if (docSnap.exists()) {
                // Вставляем секретный текст из базы в HTML
                document.getElementById('secret-text-container').innerText = docSnap.data().content;
              } else {
                console.log("Документ не найден!");
              }
            } else {
              // Пользователь вышел
              loginScreen.classList.remove('hidden');
              secretContent.style.display = 'none';
            }
        });

        // 2. Обработчики кнопок
        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch((error) => {
                console.error("Ошибка входа:", error);
                alert("Не удалось войти. Проверьте настройки Firebase.");
            });
        });

        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });
    </script>
</body>
</html>
