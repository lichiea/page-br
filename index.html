<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. Жесткая политика безопасности -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebase.com wss://*.firebase.com; style-src 'self' 'unsafe-inline';">
    
    <!-- 2. Фикс фавикона (пустой data URI) -->
    <link rel="icon" href="data:,">
    
    <title>Защищенная зона</title>
    <style>
        /* Ваши стили остаются здесь */
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        .hidden { display: none; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 8px; margin-top: 5px; }
        button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
        .error { color: red; font-size: 14px; }
        .success { color: green; font-size: 14px; }
    </style>
</head>
<body>
    <div id="auth-screen">
        <h2>Вход в систему</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit">Войти</button>
            <div id="login-error" class="error"></div>
        </form>
    </div>

    <div id="user-screen" class="hidden">
        <h2>Добро пожаловать!</h2>
        <p>Вы вошли как: <strong id="user-email"></strong></p>
        <div style="background: #e8f5e9; padding: 15px; border-radius: 4px;">
            <h3>Секретные данные:</h3>
            <p id="secret-text">Загрузка...</p>
        </div>
        <button id="logout-btn" style="background: #d93025; color: white; border: none;">Выйти</button>
    </div>

    <!-- 3. ЕДИНСТВЕННЫЙ скрипт на странице, и он внешний -->
    <script type="module" src="app.js"></script>
</body>
</html>
