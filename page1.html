<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница 1</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="user-header">
            <a href="dashboard.html" class="back-link">← Назад к меню</a>
            <button id="logout-btn" class="btn-logout">Выйти</button>
        </header>

        <div class="page-content">
            <h2>Страница 1</h2>
            <p>Это защищённый контент, доступный только авторизованным пользователям.</p>
            <div id="secret-content">
                <h3>Секретная информация:</h3>
                <p id="secret-text">Загрузка...</p>
            </div>
        </div>
    </div>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/check-auth.js"></script>
    <script type="module">
        import { db } from './js/config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        async function loadSecretData() {
            try {
                const docRef = doc(db, 'secrets', 'protected_content');
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    document.getElementById('secret-text').textContent = docSnap.data().content;
                } else {
                    document.getElementById('secret-text').textContent = 'Документ не найден.';
                }
            } catch (error) {
                document.getElementById('secret-text').textContent = 'Ошибка загрузки.';
            }
        }

        loadSecretData();
    </script>
</body>
</html>
